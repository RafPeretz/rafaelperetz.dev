name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint · Types · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: i18n parity (FR/HE keys match EN)
        run: pnpm check:i18n

      - name: Colour contrast (WCAG AA, both themes)
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      - name: Smoke test (production build, real Chrome)
        run: |
          pnpm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null -H "Accept-Language: en-US" http://localhost:3000/ && break; sleep 1; done
          pnpm smoke http://localhost:3000 || { cat /tmp/next.log; exit 1; }
